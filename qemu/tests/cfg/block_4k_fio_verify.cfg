- block_4k_fio_verify:
    virt_test_type = qemu
    type = block_4k_fio_verify
    only Linux
    not_preprocess = yes
    kill_vm = yes
    data_images = "stg1"
    images += " ${data_images}"
    image_boot = yes
    image_format_stg1 = raw
    image_raw_device_stg1 = yes
    image_name_stg1 = TBD
    force_create_image_stg1 = no
    force_remove_image_stg1 = no
    drive_format_stg1 = virtio
    drive_cache_stg1 = none
    image_aio_stg1 = threads
    blk_extra_params_stg1 = "serial=stg1,write-cache=on,request-merging=off"
    iothreads = iot1 iot2 iot3 iot4 iot5 iot6
    iothread_scheme =
    image_iothread =
    image_iothread_vq_mapping_stg1 = iot1 iot2 iot3 iot4 iot5 iot6
    tmpdir = /home/tmp/block_4k_fio
    loop_img = ${tmpdir}/data.raw
    loop_dev_file = ${tmpdir}/loop_dev
    loop_img_size = 16G
    pre_command = "mkdir -p ${tmpdir} &&"
    pre_command += " qemu-img create -f raw ${loop_img} ${loop_img_size} &&"
    pre_command += " losetup -f --show --sector-size 4096 ${loop_img} > ${loop_dev_file}"
    pre_command_timeout = 60
    post_command = "losetup -d `cat ${loop_dev_file}` ;"
    post_command += " rm -rf ${tmpdir}"
    post_command_timeout = 30
    # Note that despite the warning that fio prints ("fio: multiple writers may
    # overwrite blocks that belong to other jobs. This can cause verification
    # failures."), this config is safe:
    #
    # offset_increment=512 lets each job start at a different offset and
    # rw=write:7680 makes jobs skip 7680 bytes after each write.
    # 7680 = 15 * bs (512), so job i writes at offsets 512*i + 8192*k and with
    # 12 jobs, no two jobs ever write the same 512-byte block, making verify
    # results deterministic.
    #
    # Different jobs *do* touch the same 4k sector of the loop device, which is
    # what we want to provoke potential bugs in QEMU's read-modify-write cycle
    # for 512b-on-4k emulation.
    fio_options = "--name=test --direct=1 --ioengine=libaio"
    fio_options += " --rw=write:7680 --bs=512 --iodepth=32"
    fio_options += " --numjobs=12 --offset_increment=512"
    fio_options += " --size=128m --verify=crc32c --do_verify=1"
    fio_options += " --verify_fatal=0 --continue_on_error=verify"
    fio_options += " --group_reporting"
    fio_cmd_timeout = 600
