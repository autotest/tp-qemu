- flow_caches_stress_test:
    no Windows
    type = flow_caches_stress_test
    image_snapshot = yes
    hostpasswd = redhat
    start_vm = no
    #netperf server is main vm, the netperf client is the host or another vm
    #Set the netperf client via dsthost
    netperf_link = netperf-2.7.1.tar.bz2
    RHEL.4:
        netperf_link = netperf-2.4.5.tar.bz2
    server_path = /var/tmp/
    client_path = /var/tmp/
    filesize = 4000
    transfer_timeout = 1000
    netperf_timeout = 600
    compile_option_server = --enable-burst
    compile_option_client = --enable-burst
    server_shell_client = ssh
    server_shell_port = 22
    # Prep only: if nf_conntrack stays loaded, raise table limit so it does not
    # throttle TCP_CRR. 0 historically meant "unlimited"; kernels after
    # "netfilter: conntrack: disable 0 value for conntrack_max setting"
    # (RHEL 10.3+ netfilter rebase) reject 0 with EINVAL — use INT_MAX there.
    # Separate host/guest params so mixed-version runs keep the right value.
    nf_conntrack_max_set_host = "echo 0 > /proc/sys/net/nf_conntrack_max"
    nf_conntrack_max_set_guest = "echo 0 > /proc/sys/net/nf_conntrack_max"
    Host_RHEL.m10.u3, Host_RHEL.m10.u4, Host_RHEL.m10.u5, Host_RHEL.m10.u6:
        nf_conntrack_max_set_host = "echo 2147483647 > /proc/sys/net/nf_conntrack_max"
    RHEL.10.3, RHEL.10.4, RHEL.10.5, RHEL.10.6:
        nf_conntrack_max_set_guest = "echo 2147483647 > /proc/sys/net/nf_conntrack_max"
    #test_protocols = TCP_STREAM
    disable_firewall = "service iptables stop; systemctl stop firewalld.service"
    deviation_time = 70
    variants:
        - multi_queues:
            no Host_RHEL.m5, Host_RHEL.m6
            only virtio_net
            queues = 4
        - no_multi_queues:
            queues = 1
